global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: cbdemo
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8402   # L4-02
          - host.docker.internal:8205   # L2-05（运行时也会被采集）

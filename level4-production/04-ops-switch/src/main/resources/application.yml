server:
  port: 8404

spring:
  application:
    name: cbdemo-l4-04

downstream:
  base-url: http://localhost:8081

resilience4j:
  circuitbreaker:
    instances:
      inventory:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

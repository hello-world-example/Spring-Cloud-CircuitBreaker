<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>断路器参数计算器</title>
<style>
/* VOICE: plain engineering tool, no decoration
   IDEA: an internal ops wiki page with a form and a config block
   PICTURE: the generated config itself
   COLOUR and TYPE: white / near-black, one muted blue for focus and active state; system fonts
   LAYOUT: form left, output right; stacks below 900px */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#16181b);--ink:light-dark(#1d1f23,#e6e7e9);--mute:light-dark(#62666d,#9a9ea5);--line:light-dark(#dcdfe3,#33373d);--soft:light-dark(#f6f7f8,#1e2125);--acc:light-dark(#2457c5,#7ea6f2);--warn:light-dark(#a8451f,#f0a07e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow-x:clip}
.wrap{max-width:1180px;margin:0 auto;padding:28px max(4vw,16px) 48px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:22px}
h1{font-size:22px;font-weight:600;margin:0}
.sub{color:var(--mute);font-size:14px;margin:6px 0 0;max-width:72ch}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
.grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:36px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 12px;min-height:34px;cursor:pointer}
button:hover{border-color:var(--mute)}
button.on{border-color:var(--acc);color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.seg{display:inline-flex}.seg button{border-radius:0}.seg button:first-child{border-radius:4px 0 0 4px}.seg button:last-child{border-radius:0 4px 4px 0;margin-left:-1px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.presets span{font-size:13px;color:var(--mute);align-self:center;margin-right:2px}
fieldset{border:0;border-top:1px solid var(--line);padding:12px 0 4px;margin:0}
legend{font-size:13px;font-weight:600;color:var(--mute);padding:0 6px 0 0}
.row{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:10px;align-items:center;margin-bottom:8px}
.row label{font-size:14px}
.row small{display:block;font-size:12.5px;color:var(--mute)}
.in{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.in:focus-within{border-color:var(--acc)}
.in input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;padding:6px 8px;min-height:36px;text-align:right;outline:none}
.in span{padding-right:8px;color:var(--mute);font-size:13px;white-space:nowrap}
select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px;min-height:36px}
textarea{width:100%;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-height:60px;resize:vertical}
.tl{display:block;font-size:14px;margin:4px 0 4px}
.warn{list-style:none;padding:0;margin:0 0 18px}
.warn li{font-size:14px;padding:6px 0 6px 12px;border-left:2px solid var(--warn);margin-bottom:6px}
.warn li.info{border-color:var(--line);color:var(--mute)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bar .sp{flex:1}
pre{overflow-x:auto;margin:0;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:14px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
pre .c{color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 0}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;font-size:13px;color:var(--mute)}
td.n{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
td code{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere}
td.why{color:var(--mute)}
section+section{margin-top:28px}
details{margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;font-size:14px}
details li{color:var(--mute);font-size:14px;margin-bottom:4px}
.note{font-size:13px;color:var(--mute);margin-top:18px}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:2px 0;padding-inline-start:6em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:5.5em;margin-inline-start:-6em;color:var(--mute)}.row{grid-template-columns:minmax(0,1fr) 124px}}
</style>
</head>

 c:{

en:{title:'Resilience4j Circuit Breaker Calculator',sub:'Enter what you know about the downstream service. The page derives a starting configuration and explains each value. These are rules of thumb: validate with traffic replay or fault injection before production.',
 presets:'Examples:',reset:'Restore sample data',copy:'Copy',copied:'Copied',selected:'Selected, press Ctrl+C',hTable:'Parameters and rationale',th:['Parameter','Value','Rationale'],hRules:'Derivation rules',

 f:{name:['Instance name'],avgQps:['Average QPS'],minQps:['Off-peak QPS','Lowest period, e.g. overnight'],p50:['P50 latency'],p99:['P99 latency'],timeout:['Current timeout','TimeLimiter or HTTP client'],baseErr:['Peak error rate, normal','Fault-type exceptions only'],failErr:['Error rate during outages'],failSlow:['Slow-call share when degraded','Calls above P99×1.5'],recMed:['Median recovery time'],recMax:['Longest recovery time'],fragile:['Downstream resilience'],rec:['Exceptions that count as failures (one per line)'],ign:['Business exceptions to ignore (one per line)']},

 rules:['Window type: TIME_BASED if off-peak QPS is below 5 or average is more than 5× off-peak; otherwise COUNT_BASED.','TIME_BASED window: about 100 calls per window at off-peak, clamped to 10–60 s. COUNT_BASED window: about average QPS × 10 s, clamped to 50–1000.','Minimum calls: about half of one off-peak window, at least 10 (20 for COUNT_BASED).','Failure-rate threshold: the larger of "normal peak + 15 points" and the midpoint of normal and outage error rates, clamped to 20–80%, rounded to 5.','Slow-call duration: P99 × 1.5, capped at 80% of the timeout, rounded to 50 ms. Slow-call rate: midpoint of ~1% and the degraded share, clamped to 30–90%.','Open-state wait: median recovery time, clamped to 5–120 s. If the longest recovery exceeds 3× the median, use exponential backoff (×2, capped at the longest recovery).','False-trip probability: normal approximation to the binomial — the chance that random noise pushes one window above the threshold during normal operation.'],

const SECS=[['basic',['name']],['traffic',[['avgQps','qps'],['minQps','qps']]],['latency',[['p50','ms'],['p99','ms'],['timeout','ms']]],['errors',[['baseErr','pct'],['failErr','pct'],['failSlow','pct']]],['recovery',[['recMed','s'],['recMax','s'],'fragile']],['exc',['rec','ign']]];

 {name:'orderService',avgQps:800,minQps:120,p50:40,p99:220,timeout:1000,baseErr:0.8,failErr:60,failSlow:70,recMed:30,recMax:90,fragile:'20',rec:'java.io.IOException\njava.util.concurrent.TimeoutException\norg.springframework.web.client.HttpServerErrorException',ign:'com.example.BusinessException\norg.springframework.web.client.HttpClientErrorException'},

const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const r5=v=>Math.round(v/5)*5;
const r50=v=>Math.max(50,Math.round(v/50)*50);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
function erfc(x){const t=1/(1+.5*Math.abs(x));const y=t*Math.exp(-x*x-1.26551223+t*(1.00002368+t*(.37409196+t*(.09678418+t*(-.18628806+t*(.27886807+t*(-1.13520398+t*(1.48851587+t*(-.82215223+t*.17087277)))))))));return x>=0?y:2-y}

function buildForm(vals){
 const L=T[lang];
 $('fields').innerHTML=SECS.map(([s,items])=>`<fieldset><legend>${L.sec[s]}</legend>`+items.map(it=>{
  const [id,u]=Array.isArray(it)?it:[it];const [lab,hint]=L.f[id];
  if(id==='rec'||id==='ign')return `<label class="tl" for="${id}">${lab}</label><textarea id="${id}"></textarea>`;
  const l=`<label for="${id}">${lab}${hint?`<small>${hint}</small>`:''}</label>`;
  if(id==='fragile')return `<div class="row">${l}<select id="fragile">${[20,10,5].map(v=>`<option value="${v}">${L.frag[v]}</option>`).join('')}</select></div>`;
  if(id==='name')return `<div class="row">${l}<div class="in"><input id="name" type="text" style="text-align:left"></div></div>`;
  return `<div class="row">${l}<div class="in"><input id="${id}" type="number" min="0" step="any"><span>${L.u[u]}</span></div></div>`;
 }).join('')+`</fieldset>`).join('');
 F.forEach(k=>{if(vals[k]!==undefined&&vals[k]!==null&&!(typeof vals[k]==='number'&&isNaN(vals[k])))$(k).value=vals[k]});
}
function read(){const o={};F.forEach(k=>{const e=$(k);o[k]=e.type==='number'?parseFloat(e.value):e.value});return o}

function calc(i){
 const L=T[lang],Y=L.why,Wt=L.w,W=[],rows=[];
 const n=v=>isFinite(v)&&v>=0;
 const avg=n(i.avgQps)?i.avgQps:0,min=n(i.minQps)?i.minQps:avg,base=n(i.baseErr)?i.baseErr:1,fail=n(i.failErr)?i.failErr:50;
 const timeBased=min<5||avg/min>5;
 let size,minCalls,k;
 if(timeBased){
  size=clamp(Math.ceil(100/Math.max(min,0.01)),10,60);k=10;
  minCalls=clamp(Math.round(min*size*0.5),10,200);
  rows.push(['slidingWindowType','TIME_BASED',min<5?Y.tbLow(min):Y.tbRatio((avg/min).toFixed(1))]);
  rows.push(['slidingWindowSize',size+(lang==='zh'?' 秒':' s'),Y.tbSize(min,size,Math.round(min*size))]);
 }else{
  size=clamp(Math.round(avg*10),50,1000);k=20;
  minCalls=clamp(Math.round(min*10*0.5),20,size);
  rows.push(['slidingWindowType','COUNT_BASED',Y.cb]);
  rows.push(['slidingWindowSize',size,Y.cbSize]);
 }
 const winCalls=timeBased?min*size:size;
 if(winCalls<minCalls)W.push([Wt.lowTraffic(Math.round(winCalls)),'info']);
 rows.push(['minimumNumberOfCalls',minCalls,Y.minCalls(k)]);
 const thr=clamp(r5(Math.max(base+15,(base+fail)/2)),20,80);
 rows.push(['failureRateThreshold',thr+'%',Y.thr(base,((base+fail)/2).toFixed(1))]);
 if(thr>=fail)W.push([Wt.thrHigh(fail,thr)]);
 if(base>20)W.push([Wt.baseHigh(base)]);
 const p99=n(i.p99)?i.p99:500,to=n(i.timeout)&&i.timeout>0?i.timeout:p99*3;
 let slow=r50(p99*1.5);
 if(slow>to*0.8){slow=r50(to*0.8);W.push([Wt.tight(Math.round(p99*1.5),to)])}
 rows.push(['slowCallDurationThreshold',slow+' ms',Y.slow(p99,to)]);
 const fs=n(i.failSlow)?i.failSlow:60;
 const sthr=clamp(r5((1+fs)/2),30,90);
 rows.push(['slowCallRateThreshold',sthr+'%',Y.sthr(fs)]);
 if(n(i.p50)&&i.p50>0&&p99/i.p50>20)W.push([Wt.tail(Math.round(p99/i.p50)),'info']);
 const med=n(i.recMed)&&i.recMed>0?i.recMed:30,mx=n(i.recMax)&&i.recMax>0?i.recMax:med;
 const wait=clamp(Math.round(med),5,120),expo=mx>med*3,maxWait=expo?Math.round(mx):0;
 rows.push(['waitDurationInOpenState',wait+(lang==='zh'?' 秒':' s'),Y.wait(med)]);
 if(expo)rows.push(['enableExponentialBackoff','true',Y.expo(mx,maxWait)]);
 const half=parseInt(i.fragile)||10;
 rows.push(['permittedNumberOfCallsInHalfOpenState',half,Y.half[half]||Y.half[10]]);
 rows.push(['automaticTransitionFromOpenToHalfOpenEnabled','true',Y.auto]);
 rows.push(['timelimiter.timeoutDuration',to+' ms',Y.to]);
 const pb=Math.max(base,0.05)/100;
 const z=(thr/100-pb)/Math.sqrt(pb*(1-pb)/Math.max(minCalls,1));
 const risk=0.5*erfc(z/Math.SQRT2),rp=risk*100<0.01?'< 0.01':(risk*100).toFixed(2);
 W.push(risk>0.001?[Wt.risk(rp)]:[Wt.riskOk(rp),'info']);
 return {name:(i.name||'backend').replace(/[^\w-]/g,'')||'backend',timeBased,size,minCalls,thr,slow,sthr,wait,expo,maxWait,half,to,rec:lines(i.rec||''),ign:lines(i.ign||''),rows,W};
}

function yaml(c){
 const C=T[lang].c,o=[],kv=(cm,line,ind='        ')=>{o.push(`${ind}# ${cm}`,ind+line)};
 o.push('resilience4j:','  circuitbreaker:','    instances:',`      ${c.name}:`);
 kv(C.type,`slidingWindowType: ${c.timeBased?'TIME_BASED':'COUNT_BASED'}`);
 kv(C.size(c.timeBased),`slidingWindowSize: ${c.size}`);
 kv(C.minCalls,`minimumNumberOfCalls: ${c.minCalls}`);
 kv(C.thr,`failureRateThreshold: ${c.thr}`);
 kv(C.slow,`slowCallDurationThreshold: ${c.slow}ms`);
 kv(C.sthr,`slowCallRateThreshold: ${c.sthr}`);
 kv(C.wait,`waitDurationInOpenState: ${c.wait}s`);
 if(c.expo){kv(C.expo,'enableExponentialBackoff: true');kv(C.mult,'exponentialBackoffMultiplier: 2');kv(C.maxw,`exponentialMaxWaitDurationInOpenState: ${c.maxWait}s`)}
 kv(C.half,`permittedNumberOfCallsInHalfOpenState: ${c.half}`);
 kv(C.auto,'automaticTransitionFromOpenToHalfOpenEnabled: true');
 if(c.rec.length){kv(C.rec,'recordExceptions:');c.rec.forEach(e=>o.push(`          - ${e}`))}
 if(c.ign.length){kv(C.ign,'ignoreExceptions:');c.ign.forEach(e=>o.push(`          - ${e}`))}
 o.push('  timelimiter:','    instances:',`      ${c.name}:`);
 kv(C.tl,`timeoutDuration: ${c.to}ms`);
 return o.join('\n');
}
function java(c){
 const C=T[lang].c,o=[],kv=(cm,line)=>o.push(`    // ${cm}`,`    ${line}`);
 o.push('CircuitBreakerConfig config = CircuitBreakerConfig.custom()');
 kv(C.type,`.slidingWindowType(SlidingWindowType.${c.timeBased?'TIME_BASED':'COUNT_BASED'})`);
 kv(C.size(c.timeBased),`.slidingWindowSize(${c.size})`);
 kv(C.minCalls,`.minimumNumberOfCalls(${c.minCalls})`);
 kv(C.thr,`.failureRateThreshold(${c.thr})`);
 kv(C.slow,`.slowCallDurationThreshold(Duration.ofMillis(${c.slow}))`);
 kv(C.sthr,`.slowCallRateThreshold(${c.sthr})`);
 if(c.expo){o.push(`    // ${C.ivf.replace('{a}',c.wait).replace('{b}',c.maxWait)}`,'    .waitIntervalFunctionInOpenState(IntervalFunction.ofExponentialBackoff(',`        Duration.ofSeconds(${c.wait}), 2.0, Duration.ofSeconds(${c.maxWait})))`)}
 else kv(C.wait,`.waitDurationInOpenState(Duration.ofSeconds(${c.wait}))`);
 kv(C.half,`.permittedNumberOfCallsInHalfOpenState(${c.half})`);
 kv(C.auto,'.automaticTransitionFromOpenToHalfOpenEnabled(true)');
 if(c.rec.length)kv(C.rec,`.recordExceptions(${c.rec.map(s=>s+'.class').join(', ')})`);
 if(c.ign.length)kv(C.ign,`.ignoreExceptions(${c.ign.map(s=>s+'.class').join(', ')})`);
 o.push('    .build();','',`// ${C.tl}`,'TimeLimiterConfig tlConfig = TimeLimiterConfig.custom()',`    .timeoutDuration(Duration.ofMillis(${c.to}))`,'    .build();');
 return o.join('\n');
}
function paint(txt){return txt.split('\n').map(l=>/^\s*(#|\/\/)/.test(l)?`<span class="c">${esc(l)}</span>`:esc(l)).join('\n')}

function texts(){
 const L=T[lang];
 document.documentElement.lang=lang==='zh'?'zh-CN':'en';
 document.title=lang==='zh'?'断路器参数计算器':'Circuit Breaker Calculator';
 $('title').textContent=L.title;$('sub').textContent=L.sub;$('reset').textContent=L.reset;$('copy').textContent=L.copy;
 $('h-table').textContent=L.hTable;L.th.forEach((t,k)=>$('th'+(k+1)).textContent=t);
 $('h-rules').textContent=L.hRules;$('rules').innerHTML=L.rules.map(r=>`<li>${esc(r)}</li>`).join('');$('note').textContent=L.note;
 $('presets').innerHTML=`<span>${L.presets}</span>`+L.pn.map((p,k)=>`<button type="button" data-p="${k}" class="${k===preset?'on':''}">${p}</button>`).join('');
 document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',+b.dataset.p===preset));
}
function render(){
 const i=read();store.set('cbtuner',i);store.set('cbtuner-ui',{lang,tab});cfg=calc(i);
 $('warn').innerHTML=cfg.W.map(([t,k])=>`<li class="${k||''}">${esc(t)}</li>`).join('');
 $('out').innerHTML=paint(tab==='yaml'?yaml(cfg):java(cfg));
 $('tb').innerHTML=cfg.rows.map(([a,b,w])=>`<tr><td><code>${esc(a)}</code></td><td class="n">${esc(b)}</td><td class="why">${esc(w)}</td></tr>`).join('');
}
function setPreset(k){preset=k;buildForm(P[k]);texts();render()}

$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b)setPreset(+b.dataset.p)});
$('f').addEventListener('input',()=>{preset=-1;document.querySelectorAll('[data-p]').forEach(b=>b.classList.remove('on'));render()});
$('f').addEventListener('submit',e=>e.preventDefault());
$('reset').addEventListener('click',()=>setPreset(0));
$('lang').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b||b.dataset.l===lang)return;const v=read();lang=b.dataset.l;buildForm(v);texts();render()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;tab=b.dataset.t;texts();render()});
$('copy').addEventListener('click',async()=>{const b=$('copy'),L=T[lang];try{await navigator.clipboard.writeText($('out').textContent);b.textContent=L.copied}catch(e){const r=document.createRange();r.selectNodeContents($('out'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent=L.selected}setTimeout(()=>b.textContent=L.copy,1600)});

const ui=store.get('cbtuner-ui');if(ui){if(ui.tab==='java')tab='java'}
const saved=store.get('cbtuner');
if(saved){preset=-1;buildForm(saved);texts();render()}else setPreset(0);
}
</script>

server:
  port: 8207

spring:
  application:
    name: cbdemo-l2-07
  http:
    serviceclient:
      # 组名 downstream 对应 @ImportHttpServices(group = "downstream")
      downstream:
        base-url: http://localhost:8081
        read-timeout: 1s

resilience4j:
  circuitbreaker:
    instances:
      # 熔断器 id = HTTP Service 的组名
      downstream:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
  timelimiter:
    instances:
      downstream:
        timeout-duration: 2s
